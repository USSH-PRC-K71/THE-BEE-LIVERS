<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rabbit Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated; 
            image-rendering: crisp-edges; 
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
        }

        /* --- STREAMING_CHUNK: Setting up Overlays and Canvas --- */
        #eye-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 22; 
        }

        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 100; 
            opacity: 0.6;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9); 
        }

        #noise-overlay {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            pointer-events: none;
            background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            animation: tv-noise 0.12s infinite;
            opacity: 0.15; 
            z-index: 99;
            mix-blend-mode: overlay;
        }

        @keyframes tv-noise {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-1%, -1%); }
            20% { transform: translate(1%, 2%); }
            30% { transform: translate(-2%, -1%); }
            40% { transform: translate(1%, 1%); }
            50% { transform: translate(-1%, 2%); }
            60% { transform: translate(2%, -1%); }
            70% { transform: translate(-1%, -2%); }
            80% { transform: translate(1%, -1%); }
            90% { transform: translate(2%, 1%); }
        }

        #rabbit-hand-overlay {
            position: absolute;
            top: 62%; left: 84%;
            transform: translate(-35%, -45%);
            width: 48vw;
            max-width: 550px;
            height: auto;
            z-index: 25;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
            opacity: 0;
        }
        #rabbit-hand-overlay.visible { opacity: 1 !important; }
        #rabbit-hand-overlay img {
            width: 50%; 
            transform: scale(2); 
            transform-origin: bottom right;
            height: auto;
            display: block;
            mix-blend-mode: screen;
            image-rendering: pixelated; 
            filter: drop-shadow(-2px -2px 5px rgba(0,0,0,0.8)) sepia(0.3) contrast(1.5) grayscale(0.2);
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background-color: transparent;
            color: #fff;
            text-align: center;
        }
        
        .menu-bg {
            background-color: rgba(0, 0, 0, 0.85); 
            position: absolute;
            width: 100%; height: 100%;
            z-index: -1;
        }

        .hidden { display: none !important; }

        @keyframes flicker {
            0% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            5% { opacity: 0.2; text-shadow: none; }
            10% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            15% { opacity: 0.1; }
            25% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            80% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            82% { opacity: 0.5; }
            84% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            100% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
        }
        
        @keyframes fast-flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        @keyframes blink-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .blinking { animation: blink-slow 1.2s infinite; }

        /* --- STREAMING_CHUNK: Styling UI text and Blood Drips --- */
        h1 {
            font-size: 7rem;
            color: #fff; 
            margin-bottom: 50px;
            font-family: 'Caveat', cursive;
            animation: flicker 4s infinite;
            position: relative;
        }

        .rabbit-text {
            color: #ffffff;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }

        .blood-drop {
            position: absolute;
            width: 4px; height: 15px;
            background: linear-gradient(to bottom, transparent, #cc0000 40%, #7a0000);
            border-radius: 50px;
            pointer-events: none;
            z-index: 20; 
            opacity: 0;
            filter: drop-shadow(0 0 3px #ff0000);
        }

        .drop-1 { left: 15%; bottom: 10px; animation: drip 3.2s infinite ease-in; }
        .drop-2 { left: 45%; bottom: 5px; width: 5px; height: 22px; animation: drip 2.7s infinite ease-in 1.2s; }
        .drop-3 { left: 70%; bottom: 15px; width: 3px; height: 18px; animation: drip 3.8s infinite ease-in 0.5s; }
        .drop-4 { left: 90%; bottom: 8px; width: 4px; height: 16px; animation: drip 3.0s infinite ease-in 2.1s; }

        @keyframes drip {
            0% { transform: translateY(0) scaleY(0.5); opacity: 0; }
            5% { transform: translateY(0) scaleY(1.2); opacity: 1; }
            95% { opacity: 1; }
            100% { transform: translateY(100vh) scaleY(2.5); opacity: 0; }
        }

        .beta-tag {
            position: absolute;
            bottom: 5px; right: -30px;
            font-size: 2rem; color: #ff3333;
            transform: rotate(-15deg);
            animation: flicker 3s infinite reverse;
            text-transform: lowercase;
            font-family: 'Courier New', Courier, monospace;
        }

        #main-menu button, #pause-menu button, #settings-menu button, #credit-menu button, #donate-menu button {
            font-family: 'Caveat', cursive;
            text-transform: none;
            color: #cc0000;
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 3rem;
            padding: 5px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        #main-menu button:hover, #pause-menu button:hover, #settings-menu button:hover, #credit-menu button:hover, #donate-menu button:hover {
            color: #fff;
            text-shadow: 0 0 15px #f00, 0 0 30px #f00;
            transform: scale(1.1);
        }

        .menu-btns-vertical { 
            display: flex; flex-direction: column; 
            gap: 10px; align-items: center;
        }

        #btn-play, #btn-resume { font-size: 4.5rem !important; margin-bottom: 5px; }

        .info-panel {
            background: rgba(10,10,10,0.95);
            border: 1px solid #555;
            padding: 40px;
            width: 450px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        #btn-ingame-menu {
            position: absolute;
            top: 20px; left: 20px;
            font-size: 2.5rem;
            padding: 5px 15px;
            z-index: 5;
            background: rgba(0,0,0,0.6);
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
            color: #fff;
        }
        #btn-ingame-menu:hover { background: rgba(200,0,0,0.8); border-color: #f00; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-size: 1.2rem; font-family: 'Courier New', Courier, monospace;}
        .setting-row input[type="range"] { width: 200px; cursor: pointer; }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background-color: rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%);
            z-index: 5;
            border-radius: 50%;
            transition: all 0.2s ease-in-out;
            pointer-events: none;
        }
        #crosshair.glow { width: 8px; height: 8px; background-color: #ff3333; box-shadow: 0 0 15px #ff0000, 0 0 5px #ff0000; }

        #hover-text {
            position: absolute;
            top: 55%; left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 1.2rem;
            text-shadow: 1px 1px 3px #000;
            pointer-events: none;
            z-index: 5;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #fff;
        }

        #flashlight-ui {
            position: absolute;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid #888; border-radius: 10px;
            z-index: 5; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        #flashlight-ui.active { background-color: rgba(255, 255, 200, 0.6); border-color: #fff; box-shadow: 0 0 20px rgba(255, 255, 200, 0.5); }
        #flashlight-ui img { width: 40px; height: 40px; object-fit: contain; }

        .key-hint {
            position: absolute;
            bottom: -5px; right: -5px;
            width: 24px; height: 24px;
            background: rgba(200, 0, 0, 0.9);
            border-radius: 50%;
            font-size: 14px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #fff; color: white;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        .esc-hint { width: 30px; height: 30px; font-size: 11px; bottom: -10px; right: -10px; background: rgba(50, 50, 50, 0.9); }

        #instructions {
            position: absolute;
            top: 20px; right: 20px;
            color: rgba(255,255,255,0.6);
            z-index: 5; font-size: 1rem;
            pointer-events: none;
            background: rgba(0,0,0,0.3); padding: 10px; border-right: 3px solid #fff;
            text-align: right; transition: opacity 2s ease-in-out; opacity: 1;
        }

        #subtitle {
            position: absolute;
            top: 10%; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 1.5rem; text-shadow: 2px 2px 4px #000;
            z-index: 6; text-align: center; pointer-events: none;
            opacity: 0; transition: opacity 0.5s ease-in-out;
            max-width: 80%; white-space: pre-wrap; 
        }

        #fade-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            z-index: 20; opacity: 0; pointer-events: none;
            transition: opacity 3s ease-in-out, background-color 1s;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 3rem; font-weight: bold;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.1s infinite; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="crt-overlay"></div>
    <div id="noise-overlay"></div>
    <div id="fade-overlay"><span id="end-text"></span></div>
    
    <canvas id="eye-canvas"></canvas>

    <!-- --- STREAMING_CHUNK: HTML HUD and Menus --- -->
    <div id="hud" class="hidden">
        <button id="btn-ingame-menu">
            ☰
            <div class="key-hint esc-hint">ESC</div>
        </button>
        <div id="crosshair"></div>
        <div id="hover-text" class="hidden"></div>
        <div id="flashlight-ui">
            <img src="flashlight.png" onerror="this.onerror=null; this.src='https://placehold.co/50x50/333/fff?text=FL';" alt="Flashlight">
            <div class="key-hint">F</div>
        </div>
        <div id="subtitle"></div>
        <div id="rabbit-hand-overlay">
            <img src="Hand.jpg" onerror="this.onerror=null; this.src='https://placehold.co/400x300/111/f00?text=Hand.jpg+Missing';" alt="Holding Rabbit">
        </div>
        <div id="instructions">
            [W,A,S,D] Move<br>
            [Leftclick] Interact<br>
            [F] Flashlight<br>
            [ESC] Menu
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="ui-layer">
        <div class="menu-bg"></div>
        <h1 style="position: relative; z-index: 2;">
            The <span class="rabbit-text">Rabbit
                <span class="blood-drop drop-1"></span>
                <span class="blood-drop drop-2"></span>
                <span class="blood-drop drop-3"></span>
                <span class="blood-drop drop-4"></span>
            </span> Experience
            <span class="beta-tag">beta</span>
        </h1>
        <div class="menu-btns-vertical" style="position: relative; z-index: 2;">
            <button id="btn-play">Play</button>
            <button id="btn-credit">Credits</button>
            <button id="btn-donate">Donate</button>
        </div>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="ui-layer hidden" style="z-index: 15;">
        <div class="menu-bg"></div>
        <h2 style="font-family: 'Caveat', cursive; font-size: 6rem; color: #cc0000; margin-bottom: 30px; animation: flicker 4s infinite;">Paused</h2>
        <div class="menu-btns-vertical">
            <button id="btn-resume">Continue</button>
            <button id="btn-settings">Settings</button>
            <button id="btn-quit-main">Main Menu</button>
        </div>
    </div>

    <!-- Settings Menu -->
    <div id="settings-menu" class="ui-layer hidden" style="z-index: 16;">
        <div class="menu-bg"></div>
        <div class="info-panel">
            <h2 style="font-family: 'Caveat', cursive; font-size: 3rem; color: #cc0000; font-family: 'Courier New', Courier, monospace;">Settings</h2>
            <div class="setting-row">
                <label>Volume:</label>
                <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="1">
            </div>
            <div class="setting-row">
                <label>FOV:</label>
                <input type="range" id="fov-slider" min="50" max="100" step="5" value="65">
            </div>
        </div>
        <button id="btn-settings-back" class="btn-back">Back</button>
    </div>

    <!-- Credit Menu -->
    <div id="credit-menu" class="ui-layer hidden">
        <div class="menu-bg"></div>
        <div class="info-panel">
            <h2 style="font-family: 'Caveat', cursive; font-size: 3rem; color: #cc0000; font-family: 'Courier New', Courier, monospace;">Credits</h2>
            <p style="font-size: 1.2rem; color: #aaa; font-family: 'Courier New', Courier, monospace;">"Toàn đẹp trai" made this shit</p>
        </div>
        <button class="btn-back">Back</button>
    </div>

    <!-- Donate Menu -->
    <div id="donate-menu" class="ui-layer hidden">
        <div class="menu-bg"></div>
        <div class="info-panel">
            <h2 style="font-family: 'Caveat', cursive; font-size: 3rem; color: #cc0000; font-family: 'Courier New', Courier, monospace;">Donate</h2>
            <p style="font-family: 'Courier New', Courier, monospace;">[ SCAN TO SUPPORT ]</p>
            <img src="image_cad759.jpg" onerror="this.onerror=null; this.src='https://placehold.co/300x400/111/f00?text=QR+Code+Missing';" alt="QR Donate" style="width: 300px; max-width: 100%; height: auto; margin: 0 auto; display: block; border: 4px solid #333; border-radius: 10px;">
        </div>
        <button class="btn-back">Back</button>
    </div>

    <script>
        // --- STREAMING_CHUNK: Logic Eye Animation and Audio ---
        const eyeCanvas = document.getElementById('eye-canvas');
        const eyeCtx = eyeCanvas.getContext('2d');
        let eyeAnimState = 0; 
        let eyeAnimTimer = 0;

        function resizeEyeCanvas() {
            eyeCanvas.width = window.innerWidth;
            eyeCanvas.height = window.innerHeight;
            if (eyeAnimState === 0) eyeCtx.clearRect(0, 0, eyeCanvas.width, eyeCanvas.height);
        }
        window.addEventListener('resize', resizeEyeCanvas);
        resizeEyeCanvas();

        function startEyeWakeUp() {
            eyeAnimState = 1; eyeAnimTimer = 0; updateEyeAnimation(0); 
        }

        function updateEyeAnimation(delta) {
            if (eyeAnimState === 0) return;
            eyeAnimTimer += delta; let progress = 0;
            if (eyeAnimTimer < 0.6) progress = (eyeAnimTimer / 0.6) * 0.25;
            else if (eyeAnimTimer < 1.0) { let t = (eyeAnimTimer - 0.6) / 0.4; progress = 0.25 - (t * 0.20); } 
            else if (eyeAnimTimer < 3.5) { let t = (eyeAnimTimer - 1.0) / 2.5; progress = 0.05 + (t * 0.95); } 
            else { progress = 1; eyeAnimState = 0; }

            eyeCtx.clearRect(0, 0, eyeCanvas.width, eyeCanvas.height);
            if (progress >= 1) return; 

            const w = eyeCanvas.width; const h = eyeCanvas.height; const midY = h / 2;
            const openAmount = progress * h * 0.7; const curveFlatness = progress * h * 0.4; 

            eyeCtx.fillStyle = '#000000';
            eyeCtx.beginPath(); eyeCtx.moveTo(0, 0); eyeCtx.lineTo(0, midY - openAmount);
            eyeCtx.quadraticCurveTo(w / 2, midY + (h * 0.15) - openAmount - curveFlatness, w, midY - openAmount);
            eyeCtx.lineTo(w, 0); eyeCtx.fill();
            eyeCtx.beginPath(); eyeCtx.moveTo(0, h); eyeCtx.lineTo(0, midY + openAmount);
            eyeCtx.quadraticCurveTo(w / 2, midY - (h * 0.15) + openAmount + curveFlatness, w, midY + openAmount);
            eyeCtx.lineTo(w, h); eyeCtx.fill();
        }

        const uiElems = {
            main: document.getElementById('main-menu'),
            pause: document.getElementById('pause-menu'),
            settings: document.getElementById('settings-menu'),
            credit: document.getElementById('credit-menu'),
            donate: document.getElementById('donate-menu'),
            hud: document.getElementById('hud'),
            subtitle: document.getElementById('subtitle'),
            fade: document.getElementById('fade-overlay'),
            endText: document.getElementById('end-text'),
            ingameMenuBtn: document.getElementById('btn-ingame-menu'),
            crosshair: document.getElementById('crosshair'),
            hoverText: document.getElementById('hover-text'),
            rabbitHand: document.getElementById('rabbit-hand-overlay')
        };
        const flashlightBtn = document.getElementById('flashlight-ui');

        let currentCycle = 1;
        let morningTextTriggered = false; let hasTurnedOnLight = false; let isDaytime = false; let isAfternoon = false;
        let hasScared = false; let hasEnteredHouse = false; let isFlashlightOn = false; let flashlightDead = false;
        let finalCycleWalkTime = 0; let finalCycleFlags = [false, false, false, false]; let isFinalJumpscare = false; 
        let finalScareBasePos = new THREE.Vector3(); let isPaused = false; let shakeTimer = 0; let cameraBasePos = new THREE.Vector3();
        let isNightmare = false; let nightmareDoorOpened = false; let hasSeenBloodInNightmare = false;
        let knockingInterval = null; let isNightmareChase = false; let rabbitLanded = false; 
        let roadRabbitState = 0; let roadRabbitTimer = 0;
        let whiteForestTimer = 0; let isWhiteForest = false; let whiteRabbits = [];
        let isWakingUp = false; let wakeUpTimer = 0;

        function showRabbitHand() { uiElems.rabbitHand.classList.add('visible'); }
        function hideRabbitHand() { uiElems.rabbitHand.classList.remove('visible'); }

        document.getElementById('btn-credit').addEventListener('click', () => { uiElems.main.classList.add('hidden'); uiElems.credit.classList.remove('hidden'); });
        document.getElementById('btn-donate').addEventListener('click', () => { uiElems.main.classList.add('hidden'); uiElems.donate.classList.remove('hidden'); });
        document.querySelectorAll('.btn-back').forEach(btn => btn.addEventListener('click', () => {
            uiElems.credit.classList.add('hidden'); uiElems.donate.classList.add('hidden'); uiElems.settings.classList.add('hidden');
            if (controlsEnabled) uiElems.pause.classList.remove('hidden'); else uiElems.main.classList.remove('hidden');
        }));
        uiElems.ingameMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); document.exitPointerLock(); uiElems.pause.classList.remove('hidden'); uiElems.ingameMenuBtn.classList.add('hidden'); });
        document.getElementById('btn-resume').addEventListener('click', () => { uiElems.pause.classList.add('hidden'); document.body.requestPointerLock(); });
        document.getElementById('btn-settings').addEventListener('click', () => { uiElems.pause.classList.add('hidden'); uiElems.settings.classList.remove('hidden'); });
        document.getElementById('btn-quit-main').addEventListener('click', () => { location.reload(); });

        const volSlider = document.getElementById('vol-slider'); const fovSlider = document.getElementById('fov-slider'); let masterVolume = 1.0;
        const sfx = {
            path_steps: new Audio('musics/path_steps.mp3'), house_steps: new Audio('musics/house_steps.mp3'),
            flashlight_on: new Audio('musics/flashlight_on.mp3'), flashlight_off: new Audio('musics/flashlight_off.mp3'),
            door_open: new Audio('musics/door_open.mp3'), door_close: new Audio('musics/door_close.mp3'),
            ambient_bg: new Audio('musics/ambient_bg.mp3'), jumpscare_1: new Audio('musics/jumpscare_1.mp3'),
            jumpscare_final: new Audio('musics/jumpscare_final.mp3'), rain: new Audio('musics/rain.mp3'),
            knock: new Audio('musics/knock.mp3'), music_3am: new Audio('musics/3AM.mp3'), white_forest: new Audio('musics/white_forest.mp3'),
            happy_ending: new Audio('musics/happy_ending.mp3'), bad_ending: new Audio('musics/bad_ending.mp3')
        };
        sfx.ambient_bg.loop = true; sfx.jumpscare_final.loop = true; sfx.rain.loop = true; sfx.knock.loop = true; sfx.music_3am.loop = true; sfx.white_forest.loop = true;
        sfx.happy_ending.loop = true; sfx.bad_ending.loop = true;

        volSlider.addEventListener('input', (e) => {
            masterVolume = parseFloat(e.target.value); if (masterGain) masterGain.gain.value = masterVolume;
